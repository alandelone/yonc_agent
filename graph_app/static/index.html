    header{display:flex;align-items:center;gap:24px;padding:0 20px;border-bottom:1px solid #20242d;background:rgba(12,14,19,.96);z-index:20}.brand{display:flex;align-items:center;gap:11px;min-width:216px}.mark{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(145deg,#a78bfa,#6d4de5);box-shadow:0 8px 30px #7453eb44;font-weight:800}.brand strong{font-size:14px;letter-spacing:.01em}.brand small{display:block;color:var(--muted);font-size:10px;margin-top:1px}.main-nav{display:flex;align-self:stretch;gap:3px}.main-nav button{position:relative;border:0;background:transparent;color:var(--muted);padding:0 14px;cursor:pointer}.main-nav button:hover,.main-nav button.active{color:var(--text)}.main-nav button.active:after{content:"";height:2px;position:absolute;left:12px;right:12px;bottom:0;background:var(--accent);border-radius:2px}.header-spacer{flex:1}.pace{max-width:370px;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.header-action{border:1px solid var(--line2);border-radius:8px;background:var(--raised);padding:8px 11px;cursor:pointer}.header-action:hover{border-color:#6e5acf}
    main,.view{min-height:0;height:100%}.view{display:none}.view.active{display:block}.canvas-shell{display:grid;grid-template-columns:minmax(0,1fr) 326px;height:100%}.workspace{min-width:0;position:relative;background:#0b0e14;overflow:hidden}.canvas-toolbar{position:absolute;z-index:8;top:14px;left:14px;right:14px;height:45px;display:flex;align-items:center;gap:8px;padding:6px;border:1px solid #2b303b;border-radius:11px;background:rgba(20,23,31,.92);backdrop-filter:blur(16px);box-shadow:0 8px 26px #0005}.search{width:min(300px,28vw);border:0;outline:0;background:#0d1016;border-radius:7px;padding:8px 11px;color:var(--text)}.search::placeholder{color:#747b88}.tool-sep{height:22px;width:1px;background:var(--line)}.tool{border:0;border-radius:7px;background:transparent;padding:7px 9px;color:var(--muted);cursor:pointer}.tool:hover{background:#252a34;color:var(--text)}.tool.active{background:#30284f;color:#ddd4ff}.result-count{margin-left:auto;color:var(--faint);font-size:11px;padding-right:5px}
    .viewport{position:absolute;inset:0;overflow:hidden;cursor:grab;touch-action:none;user-select:none}.viewport.panning{cursor:grabbing}.stage{position:absolute;left:0;top:0;width:6000px;height:4200px;transform-origin:0 0;background-image:radial-gradient(circle,#333946 1px,transparent 1px);background-size:24px 24px}.edge-layer{position:absolute;inset:0;width:6000px;height:4200px;overflow:visible;pointer-events:none}.edge{fill:none;stroke:#454d5e;stroke-width:1.25;opacity:.55}.edge.contains{stroke:#3a4150}.edge.depends_on{stroke:#f0ad5d;stroke-dasharray:6 5;opacity:.8}.edge.proposed{stroke-dasharray:5 5;opacity:.35}
    .graph-node{position:absolute;width:var(--card-w);height:var(--card-h);border:1px solid color-mix(in srgb,var(--scope) 48%,#3a3f49);border-left:3px solid var(--scope);border-radius:11px;background:linear-gradient(160deg,color-mix(in srgb,var(--scope) 8%,#171b23),#12151c 76%);box-shadow:0 10px 28px #0006;cursor:grab;overflow:hidden;transition:box-shadow .15s,border-color .15s;touch-action:none}.graph-node:hover{border-color:color-mix(in srgb,var(--scope) 74%,white);box-shadow:0 14px 34px #0009}.graph-node.selected{border-color:var(--scope);box-shadow:0 0 0 2px color-mix(in srgb,var(--scope) 34%,transparent),0 18px 38px #000a}.graph-node.dragging{cursor:grabbing;transition:none;z-index:6;box-shadow:0 22px 48px #000c}.graph-node.proposed{border-style:dashed;opacity:.7}.graph-node.DOING{border-top-color:var(--warn);border-right-color:var(--warn);border-bottom-color:var(--warn)}.graph-node.DONE{border-top-color:#316e59;border-right-color:#316e59;border-bottom-color:#316e59;opacity:.76}.graph-node.pressure{box-shadow:0 0 22px #ff8c4b3f,0 10px 28px #0008}.node-top{height:28px;display:flex;align-items:center;gap:7px;padding:7px 9px 0 10px;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.075em}.kind-dot{width:7px;height:7px;border-radius:50%;background:var(--scope);box-shadow:0 0 10px var(--scope)}.node-top .stage-label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.node-expand{margin-left:auto;width:22px;height:20px;display:grid;place-items:center;border:0;border-radius:5px;background:#ffffff0a;color:#adb3c0;cursor:pointer;font-size:13px}.node-expand:hover{background:#ffffff16;color:white}.node-title{height:40px;padding:4px 12px 0;font-weight:600;font-size:13px;line-height:17px;overflow:hidden}.node-bottom{height:34px;padding:0 11px 8px;display:flex;align-items:flex-end;gap:8px}.status-pill{font-size:9px;letter-spacing:.06em;color:#adb4c0}.status-pill.DOING{color:var(--warn)}.status-pill.DONE{color:var(--good)}.meter{height:3px;flex:1;background:#2b303a;border-radius:9px;overflow:hidden;margin-bottom:4px}.meter i{display:block;height:100%;background:var(--scope);border-radius:9px}.percent{font-size:9px;color:#7d8593}.node-type-icon{margin-left:auto;color:#737b8b}
    .canvas-help{position:absolute;left:16px;bottom:16px;z-index:7;display:flex;align-items:center;gap:12px;padding:8px 11px;border:1px solid #292e39;border-radius:9px;background:#11151ddd;color:#7f8795;font-size:10px}.minimap{position:absolute;right:14px;bottom:14px;z-index:7;border:1px solid #2b303b;background:#11141ce8;border-radius:10px;padding:7px;display:flex;gap:5px}.mini-btn{width:29px;height:29px;border:0;border-radius:6px;background:#222731;color:#adb3bf;cursor:pointer}.mini-btn:hover{background:#303642;color:white}
    .inspector{border-left:1px solid #242933;background:#0e1117;overflow:auto}.inspector-head{position:sticky;top:0;z-index:3;padding:20px 20px 14px;background:#0e1117ef;backdrop-filter:blur(12px);border-bottom:1px solid #222731}.eyebrow{color:#8b77e3;text-transform:uppercase;font-size:10px;letter-spacing:.12em;font-weight:700}.inspector-head h2{font-size:17px;margin:7px 0 6px;line-height:1.3}.muted{color:var(--muted)}.small{font-size:11px}.inspector-body{padding:18px 20px}.empty-inspector{padding:44px 12px;text-align:center;color:var(--muted);line-height:1.6}.empty-icon{width:46px;height:46px;border:1px solid #363b48;border-radius:14px;display:grid;place-items:center;margin:0 auto 14px;font-size:21px;color:#9b87f6}.section{padding:16px 0;border-bottom:1px solid #222731}.section:first-child{padding-top:0}.section-title{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:#757d8d;margin-bottom:10px}.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{padding:10px;border-radius:8px;background:#151922}.stat strong{display:block;font-size:14px}.stat span{font-size:10px;color:var(--muted)}.action-row{display:flex;gap:6px;flex-wrap:wrap}.btn{border:1px solid #343a47;border-radius:7px;background:#191e27;padding:7px 9px;cursor:pointer;color:#c7ccd6}.btn:hover{border-color:#7763d5;color:white}.btn.primary{background:#6f55db;border-color:#8b75ed;color:white}.link-row{padding:7px 0;color:#aab0bd;font-size:11px}.link-row b{color:#d7dae0}.capture-toggle{width:100%;margin-top:16px;border:1px dashed #3a4050;border-radius:9px;background:#151922;padding:10px;color:#abb1bd;cursor:pointer}.capture-form{display:none;gap:9px;margin-top:12px}.capture-form.open{display:grid}.field{display:grid;gap:5px;color:#7e8695;font-size:10px}.field input,.field select{width:100%;border:1px solid #303643;border-radius:7px;background:#11151c;padding:8px;outline:0}.field input:focus,.field select:focus{border-color:#7561d5}
    .other-view{height:100%;overflow:auto;padding:26px;background:#0b0e14}.view-head{max-width:1120px;margin:0 auto 18px}.view-head h2{margin:0 0 5px;font-size:22px}.view-head p{margin:0;color:var(--muted)}.panel{max-width:1120px;margin:auto;border:1px solid #292f3a;border-radius:12px;background:#11151c;overflow:hidden}.timeline{display:grid;grid-template-columns:280px repeat(14,minmax(54px,1fr));min-width:1050px}.timeline>div{min-height:48px;padding:9px;border-right:1px solid #252b35;border-bottom:1px solid #252b35}.day{font-size:10px;color:#7d8593;text-align:center}.bar{height:26px;border-radius:6px;padding:5px 7px;background:#6851c7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:10px}.bar.pressure{box-shadow:0 0 16px #ff9e5555}.focus-card{max-width:680px;margin:60px auto;padding:42px;text-align:center}.focus-card h2{font-size:28px}.review-list{max-width:900px;margin:auto}.review-card,.operation{padding:15px 18px;border-top:1px solid #252b35}.badge{display:inline-block;margin-left:6px;padding:2px 7px;border-radius:20px;background:#252a37;color:#afb6c3;font-size:9px}.empty{padding:30px;text-align:center;color:var(--muted)}.toast{position:fixed;right:20px;bottom:20px;z-index:50;padding:10px 14px;border:1px solid #55469a;border-radius:9px;background:#211b3b;color:#eeeaff;opacity:0;transform:translateY(8px);transition:.18s;pointer-events:none}.toast.show{opacity:1;transform:none}
    @media(max-width:900px){.canvas-shell{grid-template-columns:1fr}.inspector{display:none}.pace{display:none}.brand{min-width:auto}.main-nav button{padding:0 8px}.search{width:190px}}
  </style>

<body><div class="app"><header><div class="brand"><div class="mark">Y</div><div><strong>Project Graph</strong><small>Local workspace</small></div></div><nav class="main-nav"><button data-view="canvas" class="active">Canvas</button><button data-view="timeline">Timeline</button><button data-view="focus">Focus</button><button data-view="review">Review</button></nav><div class="header-spacer"></div><div id="pace" class="pace">Reading observed delivery pace…</div><button id="new-node" class="header-action">＋ Capture</button></header><main>
  <section id="canvas" class="view active"><div class="canvas-shell"><div class="workspace"><div class="canvas-toolbar"><input id="graph-search" class="search" placeholder="Search projects and actions…"><span class="tool-sep"></span><button class="tool active" data-filter="active">Active</button><button class="tool" data-filter="all">All</button><span class="tool-sep"></span><button id="collapse-all" class="tool">Collapse all</button><button id="fit-view" class="tool">Fit view</button><span id="result-count" class="result-count"></span></div><div id="viewport" class="viewport"><div id="stage" class="stage"><svg id="edge-layer" class="edge-layer"></svg><div id="nodes-layer"></div></div></div><div class="canvas-help"><span>Drag nodes to arrange</span><span>·</span><span>Drag empty space to pan</span><span>·</span><span>Double-click a project to open it</span></div><div class="minimap"><button id="zoom-out" class="mini-btn">−</button><button id="zoom-reset" class="mini-btn">⌂</button><button id="zoom-in" class="mini-btn">＋</button></div></div><aside class="inspector"><div id="inspector-content"></div></aside></div></section>
  <section id="timeline" class="view"><div class="other-view"><div class="view-head"><h2>Timeline</h2><p>A forecast and capacity map—not a promise ledger.</p></div><div class="panel" style="overflow:auto"><div id="timeline-grid" class="timeline"></div></div></div></section>
  <section id="focus" class="view"><div class="other-view"><div class="panel focus-card"><div class="eyebrow">Single attention</div><div id="focus-content"></div></div></div></section>
  <section id="review" class="view"><div class="other-view"><div class="view-head"><h2>Review</h2><p>Proposed graph changes stay separate until you accept them.</p></div><div class="review-list"><div class="panel"><div id="proposals"></div></div><div class="panel" style="margin-top:16px"><div id="operations"></div></div></div></div></section>
</main><div id="toast" class="toast"></div></div><script>
const CARD_W=264,CARD_H=104;const $=s=>document.querySelector(s);const state={graph:{nodes:[],edges:[]},byId:new Map(),children:new Map(),selected:null,expanded:new Set(JSON.parse(localStorage.getItem('yonc-expanded')||'[]')),positions:new Map(),visible:[],pan:{x:40,y:86},zoom:.82,filter:'active',search:'',drag:null,panning:null};
const api=async(path,options={})=>{const r=await fetch('/api/v1'+path,{headers:{'Content-Type':'application/json'},...options});if(!r.ok)throw new Error((await r.json().catch(()=>({detail:r.statusText}))).detail||r.statusText);return r.status===204?null:r.json()};const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2200)}function hash(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)}function hueFor(n){let p=n;while(p?.parent_id&&state.byId.has(p.parent_id))p=state.byId.get(p.parent_id);return 190+(hash(p?.id||n.id)%150)}function scopeColor(n){return `hsl(${hueFor(n)} 68% 64%)`}function cleanTitle(t){return String(t||'Untitled').replace(/^[\s🏭🟧🔶🔸🤖💬🔜]+/u,'').trim()||t}function isPressure(n){if(!n.deadline||['DONE','CANCELLED','SUPERSEDED'].includes(n.lifecycle))return false;return(new Date(n.deadline)-new Date())<4*864e5}
async function refresh(){state.graph=await api('/graph');state.byId=new Map(state.graph.nodes.map(n=>[n.id,n]));state.children=new Map();state.graph.nodes.forEach(n=>state.children.set(n.id,[]));state.graph.edges.filter(e=>e.relation==='contains'&&!e.is_proposed).forEach(e=>{if(state.children.has(e.source_id)&&state.byId.has(e.target_id))state.children.get(e.source_id).push(state.byId.get(e.target_id))});state.graph.nodes.forEach(n=>{if(n.position)state.positions.set(n.id,{x:n.position.x,y:n.position.y})});const p=state.graph.pace;$('#pace').textContent=p.reliable?`Pace · ${p.weekly_effort} estimated hours / week`:p.message;renderCanvas();renderTimeline();renderFocus();renderReview();renderInspector()}
function roots(){return state.graph.nodes.filter(n=>!n.parent_id||!state.byId.has(n.parent_id))}function ancestors(n){const a=[];let p=n;while(p?.parent_id&&state.byId.has(p.parent_id)){p=state.byId.get(p.parent_id);a.push(p)}return a}function deriveVisible(){const q=state.search.trim().toLowerCase();let visible=[];if(q){const ids=new Set();state.graph.nodes.filter(n=>n.title.toLowerCase().includes(q)).slice(0,80).forEach(n=>{ids.add(n.id);ancestors(n).forEach(a=>ids.add(a.id))});visible=state.graph.nodes.filter(n=>ids.has(n.id))}else{const walk=n=>{visible.push(n);if(state.expanded.has(n.id))(state.children.get(n.id)||[]).forEach(walk)};roots().filter(n=>state.filter==='all'||!['DONE','CANCELLED','SUPERSEDED'].includes(n.lifecycle)).forEach(walk)}state.visible=visible;return visible}
function defaultPosition(n,index,visible){const parent=n.parent_id&&state.positions.get(n.parent_id);if(parent){const siblings=visible.filter(x=>x.parent_id===n.parent_id),i=siblings.findIndex(x=>x.id===n.id);return{x:parent.x+330,y:parent.y+(i-(siblings.length-1)/2)*126}}const rs=roots().filter(r=>state.filter==='all'||!['DONE','CANCELLED','SUPERSEDED'].includes(r.lifecycle)),rootIndex=rs.findIndex(r=>r.id===n.id);return{x:80+(rootIndex%5)*326,y:90+Math.floor(rootIndex/5)*144}}
function positionOf(n,index,visible){if(!state.positions.has(n.id))state.positions.set(n.id,defaultPosition(n,index,visible));return state.positions.get(n.id)}function applyStageTransform(){$('#stage').style.transform=`translate(${state.pan.x}px,${state.pan.y}px) scale(${state.zoom})`}
function renderCanvas(){const visible=deriveVisible(),ids=new Set(visible.map(n=>n.id));$('#result-count').textContent=`${visible.length} visible · ${state.graph.nodes.length} total`;const layer=$('#nodes-layer');layer.innerHTML=visible.map((n,i)=>{const p=positionOf(n,i,visible),kids=(state.children.get(n.id)||[]).length,ratio=Math.round((n.progress?.ratio||0)*100),depth=n.wbs_level||ancestors(n).length+1,kindIcon={TASK:'◼',ARTIFACT:'◇',RESOURCE:'◉',AGENT:'✦'}[n.kind]||'◼';return`<article class="graph-node ${n.lifecycle} ${n.is_proposed?'proposed':''} ${isPressure(n)?'pressure':''} ${state.selected?.id===n.id?'selected':''}" data-id="${n.id}" style="left:${p.x}px;top:${p.y}px;--scope:${scopeColor(n)}"><div class="node-top"><i class="kind-dot"></i><span class="stage-label">${depth<=2?(depth===1?'Project':'Module'):`WBS ${depth}`} · ${n.kind}</span>${kids?`<button class="node-expand" data-expand="${n.id}" title="${state.expanded.has(n.id)?'Collapse':'Expand'} ${kids} children">${state.expanded.has(n.id)?'−':'＋'}</button>`:''}</div><div class="node-title">${esc(cleanTitle(n.title))}</div><div class="node-bottom"><span class="status-pill ${n.lifecycle}">${n.lifecycle}</span><span class="meter"><i style="width:${ratio}%"></i></span><span class="percent">${ratio}%</span><span class="node-type-icon">${kindIcon}</span></div></article>`}).join('');layer.querySelectorAll('.graph-node').forEach(el=>{el.addEventListener('pointerdown',nodePointerDown);el.addEventListener('click',()=>{if(!state.drag?.moved)selectNode(el.dataset.id)});el.addEventListener('dblclick',()=>toggleExpand(el.dataset.id))});layer.querySelectorAll('[data-expand]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();toggleExpand(b.dataset.expand)}));renderEdges(ids);applyStageTransform()}
function renderEdges(ids){const svg=$('#edge-layer');let h='<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#555d70"/></marker></defs>';state.graph.edges.forEach(e=>{if(!ids.has(e.source_id)||!ids.has(e.target_id))return;const a=state.positions.get(e.source_id),b=state.positions.get(e.target_id);if(!a||!b)return;const x1=a.x+CARD_W,y1=a.y+CARD_H/2,x2=b.x,y2=b.y+CARD_H/2,m=(x1+x2)/2;h+=`<path class="edge ${e.relation} ${e.is_proposed?'proposed':''}" marker-end="url(#arrow)" d="M${x1} ${y1} C${m} ${y1},${m} ${y2},${x2} ${y2}"/>`});svg.innerHTML=h}
function nodePointerDown(e){if(e.button!==0||e.target.closest('button'))return;e.stopPropagation();const el=e.currentTarget,id=el.dataset.id,p=state.positions.get(id);state.drag={id,el,startX:e.clientX,startY:e.clientY,x:p.x,y:p.y,moved:false};el.setPointerCapture(e.pointerId);el.classList.add('dragging');el.onpointermove=nodePointerMove;el.onpointerup=nodePointerUp;el.onpointercancel=nodePointerUp}function nodePointerMove(e){const d=state.drag;if(!d)return;const dx=(e.clientX-d.startX)/state.zoom,dy=(e.clientY-d.startY)/state.zoom;if(Math.abs(dx)+Math.abs(dy)>3)d.moved=true;const p={x:Math.round(d.x+dx),y:Math.round(d.y+dy)};state.positions.set(d.id,p);d.el.style.left=p.x+'px';d.el.style.top=p.y+'px';renderEdges(new Set(state.visible.map(n=>n.id)))}async function nodePointerUp(){const d=state.drag;if(!d)return;d.el.classList.remove('dragging');d.el.onpointermove=d.el.onpointerup=d.el.onpointercancel=null;if(d.moved){const p=state.positions.get(d.id);try{await api('/nodes/'+d.id+'/position',{method:'PUT',body:JSON.stringify(p)});toast('Canvas position saved')}catch(err){toast(err.message)}}setTimeout(()=>state.drag=null,0)}
function toggleExpand(id){if(state.expanded.has(id))state.expanded.delete(id);else state.expanded.add(id);localStorage.setItem('yonc-expanded',JSON.stringify([...state.expanded]));renderCanvas()}function selectNode(id){state.selected=state.byId.get(id);renderCanvas();renderInspector()}function viewportPoint(e){return{x:(e.clientX-state.pan.x)/state.zoom,y:(e.clientY-state.pan.y)/state.zoom}}const viewport=$('#viewport');viewport.onpointerdown=e=>{if(e.button!==0||e.target.closest('.graph-node'))return;state.panning={x:e.clientX,y:e.clientY,panX:state.pan.x,panY:state.pan.y};viewport.setPointerCapture(e.pointerId);viewport.classList.add('panning')};viewport.onpointermove=e=>{if(!state.panning)return;state.pan.x=state.panning.panX+e.clientX-state.panning.x;state.pan.y=state.panning.panY+e.clientY-state.panning.y;applyStageTransform()};viewport.onpointerup=viewport.onpointercancel=()=>{state.panning=null;viewport.classList.remove('panning')};viewport.onwheel=e=>{e.preventDefault();const before=viewportPoint(e),factor=e.deltaY<0?1.1:.9,next=Math.max(.35,Math.min(1.6,state.zoom*factor));state.zoom=next;state.pan.x=e.clientX-before.x*next;state.pan.y=e.clientY-before.y*next;applyStageTransform()};
function renderInspector(){const box=$('#inspector-content'),n=state.selected;if(!n){box.innerHTML=`<div class="inspector-head"><div class="eyebrow">Canvas</div><h2>Navigate the work</h2><div class="muted small">Structure and relationships</div></div><div class="inspector-body"><div class="empty-inspector"><div class="empty-icon">⌁</div>Select a node to see its scope, effort, dependencies, and actions.<br><br>Double-click a project to reveal its next WBS level.</div>${captureBlock()}</div>`;wireCapture();return}const related=state.graph.edges.filter(e=>e.source_id===n.id||e.target_id===n.id),ratio=Math.round((n.progress?.ratio||0)*100),observed=(n.observed_work_seconds/3600).toFixed(1);box.innerHTML=`<div class="inspector-head"><div class="eyebrow">${n.wbs_level<=2?(n.wbs_level===1?'Project':'Module'):n.kind}</div><h2>${esc(cleanTitle(n.title))}</h2><div class="muted small">${n.lifecycle}${n.deadline?' · due '+n.deadline:''}</div></div><div class="inspector-body"><div class="section"><div class="section-title">State</div><div class="action-row"><button class="btn" data-life="TODO">Todo</button><button class="btn" data-life="DOING">Doing</button><button class="btn primary" data-focus="${n.id}">Focus</button><button class="btn" data-life="DONE">Done</button></div></div><div class="section"><div class="section-title">Signals</div><div class="stat-grid"><div class="stat"><strong>${ratio}%</strong><span>required progress</span></div><div class="stat"><strong>${n.estimated_effort_hours??'—'}h</strong><span>estimated effort</span></div><div class="stat"><strong>${observed}h</strong><span>observed focus</span></div><div class="stat"><strong>${(state.children.get(n.id)||[]).length}</strong><span>contained nodes</span></div></div></div><div class="section"><div class="section-title">Relationships</div>${related.length?related.slice(0,12).map(e=>{const other=state.byId.get(e.source_id===n.id?e.target_id:e.source_id);return`<div class="link-row"><b>${esc(e.relation.replace('_',' '))}</b> · ${esc(cleanTitle(other?.title||'Unknown'))}${e.required?'':' · optional'}</div>`}).join(''):'<div class="muted small">No graph relationships yet.</div>'}</div>${n.progress?.closure_suggested&&n.lifecycle!=='DONE'?'<div class="section"><div class="eyebrow">Closure suggestion</div><p class="muted small">All required children are complete. You decide whether this node is done.</p></div>':''}${captureBlock()}</div>`;box.querySelectorAll('[data-life]').forEach(b=>b.onclick=()=>life(n.id,b.dataset.life));box.querySelector('[data-focus]').onclick=()=>focus(n.id);wireCapture()}
function captureBlock(){return`<button id="capture-toggle" class="capture-toggle">＋ Capture a loose idea</button><form id="node-form" class="capture-form"><label class="field">Title<input name="title" required placeholder="What needs attention?"></label><label class="field">Type<select name="kind"><option>TASK</option><option>ARTIFACT</option><option>RESOURCE</option><option>AGENT</option></select></label><label class="field">Estimated effort<input name="estimated_effort_hours" type="number" min="0" step=".25" placeholder="Hours · optional"></label><label class="field">Deadline<input name="deadline" type="date"></label><button class="btn primary">Add to inbox</button></form>`}function wireCapture(){const toggle=$('#capture-toggle'),form=$('#node-form');if(!toggle||!form)return;toggle.onclick=()=>form.classList.toggle('open');form.onsubmit=async e=>{e.preventDefault();const f=new FormData(form),payload=Object.fromEntries(f);if(payload.estimated_effort_hours)payload.estimated_effort_hours=Number(payload.estimated_effort_hours);else delete payload.estimated_effort_hours;if(!payload.deadline)delete payload.deadline;try{await api('/nodes',{method:'POST',body:JSON.stringify(payload)});form.reset();toast('Captured to inbox');await refresh()}catch(err){toast(err.message)}}}
function dates(){const out=[],d=new Date();d.setHours(0,0,0,0);for(let i=0;i<14;i++){out.push(new Date(d));d.setDate(d.getDate()+1)}return out}function renderTimeline(){const grid=$('#timeline-grid'),ds=dates();let h='<div class="day">Scope / intention</div>'+ds.map(d=>`<div class="day">${d.toLocaleDateString(undefined,{month:'short',day:'numeric'})}</div>`).join('');const timed=state.graph.nodes.filter(n=>n.planned_start||n.planned_end||n.deadline).slice(0,60);if(!timed.length){grid.innerHTML=h+'<div class="empty" style="grid-column:1/-1">No dated work yet. Planned dates express intention; deadlines remain locked anchors.</div>';return}timed.forEach(n=>{const start=n.planned_start?new Date(n.planned_start):ds[0],end=n.planned_end?new Date(n.planned_end):(n.deadline?new Date(n.deadline):start),si=Math.max(0,Math.min(13,Math.round((start-ds[0])/864e5))),ei=Math.max(si,Math.min(13,Math.round((end-ds[0])/864e5)));h+=`<div>${esc(cleanTitle(n.title))}<span class="badge">${n.lifecycle}</span></div>`;for(let i=0;i<14;i++)h+=`<div>${i>=si&&i<=ei?`<div class="bar ${isPressure(n)?'pressure':''}" style="background:${scopeColor(n)}33;border-left:2px solid ${scopeColor(n)}">${i===si?esc(cleanTitle(n.title)):''}</div>`:''}</div>`});grid.innerHTML=h}
async function renderFocus(){const f=await api('/focus'),todo=state.graph.nodes.find(n=>n.lifecycle==='DOING')||state.graph.nodes.find(n=>n.lifecycle==='TODO'&&n.wbs_level===4)||state.graph.nodes.find(n=>n.lifecycle==='TODO');$('#focus-content').innerHTML=f.active?`<div class="badge">FOCUSING</div><h2>${esc(cleanTitle(f.active.node.title))}</h2><p class="muted">Started ${new Date(f.active.started_at).toLocaleTimeString()}</p><button class="btn" onclick="stopFocus()">Stop focus</button>`:todo?`<h2>${esc(cleanTitle(todo.title))}</h2><p class="muted">One task, intentionally. Completion stays your decision.</p><button class="btn primary" onclick="focus('${todo.id}')">Start focus</button>`:'<h2>Nothing actionable</h2><p class="muted">Capture a task from the Canvas.</p>'}
async function renderReview(){const[ps,ops]=await Promise.all([api('/proposals'),api('/operations')]);$('#proposals').innerHTML=`<div style="padding:16px 18px"><div class="eyebrow">Proposal queue</div></div>`+(ps.length?ps.map(p=>`<div class="review-card"><b>${esc(p.title)}</b><span class="badge">${p.status}</span><p class="muted small">${esc(p.source)} · ${p.items.length} proposed change(s)</p>${p.status==='PENDING'?`<button class="btn primary" onclick="proposal('${p.id}','accept')">Accept</button> <button class="btn" onclick="proposal('${p.id}','reject')">Reject</button>`:''}</div>`).join(''):'<div class="empty">No proposals waiting.</div>');$('#operations').innerHTML=`<div style="padding:16px 18px"><div class="eyebrow">Reversible history</div></div>`+(ops.length?ops.map(o=>`<div class="operation">${esc(o.type)} <span class="muted small">${new Date(o.created_at).toLocaleString()}</span>${!o.undone_at?` <button class="btn" onclick="undo('${o.id}')">Undo</button>`:' <span class="badge">undone</span>'}</div>`).join(''):'<div class="empty">No local operations yet.</div>')}
async function focus(id){try{await api('/focus/start/'+id,{method:'POST'});toast('Focus started');await refresh()}catch(e){toast(e.message)}}async function stopFocus(){await api('/focus/stop',{method:'POST'});toast('Focus stopped');await refresh()}async function life(id,lifecycle){try{let reason=null;if(['CANCELLED','SUPERSEDED'].includes(lifecycle))reason=prompt('Reason is required');await api('/nodes/'+id+'/lifecycle',{method:'POST',body:JSON.stringify({lifecycle,reason})});toast('State updated');await refresh()}catch(e){toast(e.message)}}async function proposal(id,action){await api('/proposals/'+id+'/'+action,{method:'POST'});toast('Proposal '+action+'ed');await refresh()}async function undo(id){await api('/operations/'+id+'/undo',{method:'POST'});toast('Operation undone');await refresh()}
function fitView(){const visible=state.visible;if(!visible.length)return;const ps=visible.map(n=>state.positions.get(n.id)).filter(Boolean),minX=Math.min(...ps.map(p=>p.x)),maxX=Math.max(...ps.map(p=>p.x))+CARD_W,minY=Math.min(...ps.map(p=>p.y)),maxY=Math.max(...ps.map(p=>p.y))+CARD_H,w=viewport.clientWidth,h=viewport.clientHeight;state.zoom=Math.max(.35,Math.min(1.05,Math.min((w-100)/(maxX-minX),(h-130)/(maxY-minY))));state.pan.x=(w-(maxX-minX)*state.zoom)/2-minX*state.zoom;state.pan.y=(h-(maxY-minY)*state.zoom)/2-minY*state.zoom;applyStageTransform()}
$('#graph-search').oninput=e=>{state.search=e.target.value;renderCanvas()};document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-filter]').forEach(x=>x.classList.remove('active'));b.classList.add('active');state.filter=b.dataset.filter;renderCanvas();setTimeout(fitView,0)});$('#collapse-all').onclick=()=>{state.expanded.clear();localStorage.setItem('yonc-expanded','[]');renderCanvas();setTimeout(fitView,0)};$('#fit-view').onclick=fitView;$('#zoom-in').onclick=()=>{state.zoom=Math.min(1.6,state.zoom*1.15);applyStageTransform()};$('#zoom-out').onclick=()=>{state.zoom=Math.max(.35,state.zoom*.85);applyStageTransform()};$('#zoom-reset').onclick=()=>{state.zoom=.82;state.pan={x:40,y:86};applyStageTransform()};$('#new-node').onclick=()=>{if(!$('#canvas').classList.contains('active'))document.querySelector('[data-view="canvas"]').click();const f=$('#node-form');if(f){f.classList.add('open');f.querySelector('input').focus()}};document.querySelectorAll('.main-nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.main-nav button').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('#'+b.dataset.view).classList.add('active')});
refresh().catch(e=>{$('#pace').textContent='Could not load graph · '+e.message});
</script></body></html>
